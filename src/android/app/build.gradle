
plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.example.ozora.senda'

    compileSdk {
        version = release(36)
    }

    defaultConfig {
        applicationId "com.example.ozora.senda"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"

        // Configuracion de la API - Persona 2
        resValue "string", "senda_api_base",
                providers.gradleProperty("SENDA_API_BASE").getOrElse("https://jvaldeo.upv.edu.es/senda/api/v1")

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        debug {
            resValue "string", "senda_api_base",
                    providers.gradleProperty("SENDA_API_BASE")
                            .getOrElse("https://jvaldeo.upv.edu.es/senda/api/v1")
        }

        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    testOptions {
        unitTests.all { tarea ->
            systemProperty 'senda.variant', tarea.name.toLowerCase().contains('release') ? 'release' : 'debug'
            def fixture = providers.environmentVariable('SENDA_CONTRACT_FIXTURE').orNull
            if (fixture != null) {
                systemProperty 'senda.contract.fixture', fixture
                inputs.file(fixture)
            }
        }
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout

    testImplementation libs.junit
    // JSONObject real en las pruebas JVM del transporte; no cambia el APK.
    testImplementation 'org.json:json:20240303'
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core

    // Lector QR - Persona 1 (Fabi)
    implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'
}
