<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
/*LEAFLET_CSS*/
html,body,#map{margin:0;width:100%;height:100%}
#map{background:#d2dfc9}
.leaflet-control-attribution{margin-bottom:var(--bottom,0px)!important}
</style>
<div id="map" aria-label="Mapa del recorrido"></div>
<script>/*LEAFLET_JS*/</script>
<script>
const map = L.map('map', {zoomControl:false}).setView([0,0], 2);
map.attributionControl.setPrefix(false);
const tiles = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom:19, attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
});
const trace = L.layerGroup().addTo(map);
const markers = L.layerGroup().addTo(map);
let started = false;
let fitted = false;
window.tilesUnavailable = false;
let tileLoaded = false;
tiles.on('tileload', () => { tileLoaded = true; window.tilesUnavailable = false; });
tiles.on('tileerror', () => { if (!tileLoaded) window.tilesUnavailable = true; });

function draw(segments, readings, active, top, bottom) {
  document.documentElement.style.setProperty('--bottom', bottom + 'px');
  const bounds = L.latLngBounds([]);
  trace.clearLayers();
  markers.clearLayers();
  for (const segment of segments) {
    L.polyline(segment, {color:'#42644e', weight:10, opacity:.6}).addTo(trace);
    L.polyline(segment, {color:'#fff', weight:6}).addTo(trace);
    for (const point of segment) bounds.extend(point);
  }
  for (const [lat, lon, label] of readings) {
    bounds.extend([lat, lon]);
    const popup = document.createElement('span');
    popup.textContent = label;
    L.circleMarker([lat, lon], {radius:6, color:'#fff', weight:3,
      fillColor:'#42644e', fillOpacity:1}).bindPopup(popup).addTo(markers);
  }
  if (segments.length) {
    const first = segments[0][0];
    const last = segments[segments.length - 1].slice(-1)[0];
    L.circleMarker(first, {interactive:false, radius:6, color:'#fff', weight:3,
      fillColor:'#ffda99', fillOpacity:1}).addTo(trace);
    if (active) {
      L.circleMarker(last, {interactive:false, radius:8, color:'#fff', weight:3,
        fillColor:'#3866ff', fillOpacity:1}).addTo(trace);
    } else if (segments.length > 1 || segments[0].length > 1) {
      const flag = L.divIcon({className:'route-finish', html:'🏁', iconSize:[24,24], iconAnchor:[2,23]});
      L.marker(last, {icon:flag, interactive:false}).addTo(trace);
    }
  }
  if (!bounds.isValid()) return;
  if (!fitted) {
    map.fitBounds(bounds, {paddingTopLeft:[24, top + 24], paddingBottomRight:[24, bottom + 24],
      maxZoom:17, animate:false});
    fitted = true;
  }
  if (!started) { tiles.addTo(map); started = true; }
  if (active && segments.length) {
    const last = segments[segments.length - 1].slice(-1)[0];
    map.panInside(last, {paddingTopLeft:[24, top + 24], paddingBottomRight:[24, bottom + 24],
      animate:false});
  }
}
</script>
</html>
